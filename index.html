<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arpit Pareek — The Magic Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05050a;
    --panel:#11111c;
    --line:#2a2a44;
    --ivory:#f3f1ec;
    --dim:#9b9ab0;
    --gold:#f0c674;
    --cyan:#4fe3ff;
    --violet:#b388ff;
    --magenta:#ff6fd8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ivory);overflow-x:hidden;}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    position:relative;
  }

  /* starfield background */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}

  /* ============ OPENING STAGE ============ */
  #openStage{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #0a0a16 0%, #05050a 70%);
    transition:opacity 1s ease, visibility 1s ease;
  }
  #openStage.hidden{opacity:0; visibility:hidden; pointer-events:none;}

  .boxWrap{display:flex;flex-direction:column;align-items:center;gap:28px;cursor:pointer;}
  .boxWrap:hover .boxGlow{opacity:1;}

  .boxGlow{
    position:absolute; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(79,227,255,.35), transparent 70%);
    filter:blur(10px); opacity:.6; transition:opacity .4s ease;
  }

  .box3d{position:relative; width:160px; height:140px; transform-style:preserve-3d; animation:floaty 3.2s ease-in-out infinite;}
  @keyframes floaty{ 0%,100%{transform:translateY(0px) rotateX(8deg);} 50%{transform:translateY(-14px) rotateX(8deg);} }

  .lid{
    position:absolute; top:0; left:0; width:160px; height:50px;
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    border-radius:10px 10px 2px 2px;
    box-shadow:0 0 40px rgba(79,227,255,.5);
    transform-origin:top center;
    transition:transform 1.1s cubic-bezier(.2,.9,.3,1.3);
    z-index:3;
  }
  .base{
    position:absolute; bottom:0; left:0; width:160px; height:100px;
    background:linear-gradient(160deg, #1b1b33, #0d0d1a);
    border:1px solid var(--line);
    border-radius:4px 4px 14px 14px;
    box-shadow:inset 0 0 30px rgba(179,136,255,.15), 0 20px 50px rgba(0,0,0,.6);
  }
  .seam{position:absolute; bottom:98px; left:6px; right:6px; height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.6;}
  .rune{position:absolute; bottom:35px; left:50%; transform:translateX(-50%); font-family:'Cinzel',serif; font-size:26px; color:var(--gold); text-shadow:0 0 14px var(--gold); opacity:.9;}

  #openStage.opened .lid{ transform:rotateX(-130deg) translateY(-6px); }

  .tapline{font-family:'Cinzel',serif; font-size:14px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; margin-top:4px;}
  .tapline b{color:var(--gold);}

  /* burst particles */
  .burst{position:fixed; inset:0; pointer-events:none; z-index:49;}
  .spark{position:absolute; width:5px; height:5px; border-radius:50%; opacity:0;}

  /* ============ MAIN CONTENT ============ */
  #main{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:72px 24px 90px; opacity:0; transition:opacity 1.1s ease .3s;}
  #main.show{opacity:1;}

  .hero{text-align:center; margin-bottom:56px;}
  .eyebrow{font-family:'Cinzel',serif; font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin-bottom:16px;}
  h1{
    font-family:'Cinzel',serif; font-weight:700; font-size:clamp(32px,6vw,58px); margin:0 0 14px;
    background:linear-gradient(100deg, var(--cyan), var(--violet) 50%, var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(179,136,255,.25);
  }
  .hero p{color:var(--dim); font-size:15px; max-width:560px; margin:0 auto; line-height:1.6;}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:22px;}

  .card{
    position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:26px 22px; text-decoration:none; color:var(--ivory); overflow:hidden;
    transition:transform .35s ease, border-color .35s ease, box-shadow .35s ease;
    display:flex; flex-direction:column; gap:10px; min-height:168px;
  }
  .card::before{
    content:""; position:absolute; inset:-1px; border-radius:14px; padding:1px;
    background:linear-gradient(135deg, var(--cyan), var(--violet), var(--magenta));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .35s ease;
  }
  .card:hover{transform:translateY(-6px); box-shadow:0 20px 50px rgba(79,227,255,.14);}
  .card:hover::before{opacity:1;}

  .cardIcon{font-size:28px; width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.04); border:1px solid var(--line);}
  .cardTitle{font-family:'Cinzel',serif; font-size:17px; font-weight:600; color:var(--ivory);}
  .cardDesc{font-size:12.5px; color:var(--dim); line-height:1.5; flex:1;}
  .cardLink{font-size:11px; color:var(--gold); letter-spacing:.04em; display:flex; align-items:center; gap:6px;}
  .cardLink .arrow{transition:transform .3s ease;}
  .card:hover .cardLink .arrow{transform:translateX(4px);}

  footer.site{text-align:center; margin-top:70px; color:var(--dim); font-size:11.5px; letter-spacing:.04em;}
  footer.site a{color:var(--gold); text-decoration:none;}

  /* ============ ROBOT LION ============ */
  #lionLayer{position:fixed; inset:0; z-index:60; pointer-events:none;}
  .lionRig{
    position:absolute; top:50%; left:50%; width:220px; height:220px;
    transform:translate(-50%,-50%) translateX(-140vw) scale(.7);
    opacity:0;
    transition:transform 1.4s cubic-bezier(.2,.75,.25,1.1), opacity .5s ease;
  }
  .lionRig.flyIn{ transform:translate(-50%,-62%) translateX(0) scale(1); opacity:1; }
  .lionRig.dock{
    top:auto; left:auto; bottom:22px; right:22px;
    transform:translate(0,0) scale(.42);
    transition:all 1s cubic-bezier(.3,.7,.3,1);
  }
  .lionRig.dock.flyIn{ transform:translate(0,0) scale(.42); }
  .lionRig.pulseDock{ animation:dockBob 2.6s ease-in-out infinite; }
  @keyframes dockBob{ 0%,100%{transform:translate(0,0) scale(.42);} 50%{transform:translate(0,-8px) scale(.42);} }

  .wing{transform-origin:70% 50%; animation:flap 0.5s ease-in-out infinite alternate;}
  .wing.right{transform-origin:30% 50%;}
  @keyframes flap{ 0%{transform:rotate(-18deg);} 100%{transform:rotate(14deg);} }

  .lionGlow{filter:drop-shadow(0 0 18px rgba(240,198,116,.55)) drop-shadow(0 0 36px rgba(79,227,255,.35));}

  .bubble{
    position:absolute; top:-20px; left:50%; transform:translate(-50%,-100%);
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:10px 16px; font-family:'Inter',sans-serif; font-size:13px; color:var(--ivory);
    white-space:nowrap; opacity:0; transition:opacity .4s ease, transform .4s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .bubble::after{
    content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    width:14px; height:14px; background:var(--panel); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    rotate:45deg;
  }
  .bubble.show{opacity:1; transform:translate(-50%,-115%);}

  /* colorful floating blobs */
  .blob{position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; z-index:0; pointer-events:none; animation:drift 18s ease-in-out infinite;}
  @keyframes drift{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-30px) scale(1.15);} }

  .musicBtn{
    position:fixed; bottom:22px; left:22px; z-index:70;
    width:46px; height:46px; border-radius:50%; cursor:pointer;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 10px 24px rgba(0,0,0,.4);
  }
  .musicBtn.on{animation:musicPulse 2s ease-in-out infinite;}
  @keyframes musicPulse{ 0%{box-shadow:0 0 0 0 rgba(255,111,216,.45);} 70%{box-shadow:0 0 0 14px rgba(255,111,216,0);} 100%{box-shadow:0 0 0 0 rgba(255,111,216,0);} }

  .cardIcon.c0{background:rgba(79,227,255,.14); border-color:rgba(79,227,255,.4);}
  .cardIcon.c1{background:rgba(179,136,255,.14); border-color:rgba(179,136,255,.4);}
  .cardIcon.c2{background:rgba(255,111,216,.14); border-color:rgba(255,111,216,.4);}
  .cardIcon.c3{background:rgba(240,198,116,.14); border-color:rgba(240,198,116,.4);}
  .cardIcon.c4{background:rgba(126,217,159,.14); border-color:rgba(126,217,159,.4);}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<!-- OPENING SEQUENCE -->
<div id="openStage">
  <div class="boxWrap" id="boxWrap">
    <div class="boxGlow"></div>
    <div class="box3d">
      <div class="lid"></div>
      <div class="base"></div>
      <div class="seam"></div>
      <div class="rune">✦</div>
    </div>
    <div class="tapline">Tap the box to enter <b>Arpit's World</b></div>
  </div>
</div>
<div class="burst" id="burst"></div>

<!-- ROBOT LION -->
<div id="lionLayer">
  <div class="lionRig" id="lionRig">
    <div class="bubble" id="lionBubble"></div>
    <svg viewBox="0 0 220 220" class="lionGlow">
      <!-- wings -->
      <g class="wing left">
        <path d="M90 110 C40 90 10 60 2 30 C34 36 70 56 92 94 Z" fill="url(#wingGrad)" opacity="0.9"/>
      </g>
      <g class="wing right">
        <path d="M130 110 C180 90 210 60 218 30 C186 36 150 56 128 94 Z" fill="url(#wingGrad)" opacity="0.9"/>
      </g>
      <!-- mane -->
      <circle cx="110" cy="118" r="56" fill="url(#maneGrad)"/>
      <!-- face plate -->
      <circle cx="110" cy="118" r="38" fill="#15151f" stroke="#f0c674" stroke-width="2"/>
      <!-- circuit lines -->
      <path d="M80 118 h12 M128 118 h12 M110 90 v10 M110 136 v10" stroke="#4fe3ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <!-- eyes -->
      <circle cx="96" cy="116" r="7" fill="#4fe3ff"><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="124" cy="116" r="7" fill="#4fe3ff"><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <!-- snout -->
      <rect x="100" y="130" width="20" height="12" rx="4" fill="#0d0d14" stroke="#f0c674" stroke-width="1.5"/>
      <!-- ears -->
      <circle cx="78" cy="80" r="10" fill="#f0c674"/>
      <circle cx="142" cy="80" r="10" fill="#f0c674"/>
      <circle cx="78" cy="80" r="5" fill="#15151f"/>
      <circle cx="142" cy="80" r="5" fill="#15151f"/>
      <defs>
        <radialGradient id="maneGrad" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#f0c674"/>
          <stop offset="60%" stop-color="#d9922f"/>
          <stop offset="100%" stop-color="#8a5a1a"/>
        </radialGradient>
        <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4fe3ff"/>
          <stop offset="100%" stop-color="#b388ff"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
</div>

<!-- MAIN HUB -->
<div class="blob" style="width:420px;height:420px;top:-100px;left:-100px;background:#4fe3ff;"></div>
<div class="blob" style="width:380px;height:380px;top:200px;right:-120px;background:#ff6fd8;animation-delay:-6s;"></div>
<div class="blob" style="width:340px;height:340px;bottom:-100px;left:30%;background:#b388ff;animation-delay:-11s;"></div>
<div class="blob" style="width:300px;height:300px;bottom:100px;right:10%;background:#f0c674;animation-delay:-3s;"></div>

<div class="musicBtn" id="musicBtn" title="Toggle music">🔈</div>

<div id="main">
  <div class="hero">
    <div class="eyebrow">The Projects Pack</div>
    <h1>Welcome to Arpit's World</h1>
    <p>Nine small AI experiments and one world, built by a self-taught student from Shrimadhopur, Rajasthan — each one a question I wanted to answer for myself first.</p>
  </div>

  <div class="grid" id="grid"></div>

  <footer class="site">
    Built by <a href="https://arpitprk89.github.io/arpit-portfolio/" target="_blank">Arpit Pareek</a> · <a href="https://github.com/arpitprk89" target="_blank">github.com/arpitprk89</a>
  </footer>
</div>

<script>
/* ---------- Starfield background ---------- */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);
const stars = Array.from({length:140}, () => ({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  r: Math.random()*1.4+0.3, s: Math.random()*0.4+0.1, phase: Math.random()*Math.PI*2
}));
function drawStars(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#ffffff';
  stars.forEach(st=>{
    const alpha = 0.35 + 0.5*Math.abs(Math.sin(t*0.0006*st.s + st.phase));
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

/* ---------- Project data ---------- */
const projects = [
  { icon:"🧠", title:"Brain 2.0", desc:"A Bayesian model that tracks student cognitive load — sleep, study hours, and stress.", url:"https://arpitprk89.github.io/Brain-2.0/" },
  { icon:"🧭", title:"Vidya Yatra", desc:"Mapping a student's journey from Class 1 to 12 — choices, pressure, and paths.", url:"https://arpitprk89.github.io/-Vidya-Yatra/" },
  { icon:"🕉️", title:"33 Koti", desc:"Vedic tradition read through modern psychology — 33 inner patterns, still unfolding.", url:"https://arpitprk89.github.io/33-KOTI/" },
  { icon:"🎲", title:"Bayesian Decision Maker", desc:"How a belief should shift, step by step, as new evidence arrives.", url:"https://arpitprk89.github.io/bayesian-decision-maker/" },
  { icon:"🎮", title:"RL Visualiser", desc:"Watch an AI agent learn to navigate a grid through trial and feedback.", url:"https://arpitprk89.github.io/rl-visuliser/" },
  { icon:"🧩", title:"Cognitive AI Simulator", desc:"Mood, stress, and focus shifting across a sequence of real decisions.", url:"https://arpitprk89.github.io/cognitive-ai-simulator/" },
  { icon:"❓", title:"AI Quiz Game", desc:"Ten questions on core AI ideas, with an explanation after every answer.", url:"https://arpitprk89.github.io/ai-quiz-game/" },
  { icon:"🧮", title:"Smart Calculator", desc:"A scientific calculator built for everyday study — fast, clean, reliable.", url:"https://arpitprk89.github.io/smart-calculator/" },
  { icon:"👤", title:"Who Is Arpit?", desc:"A short, personal introduction — the story behind the builder.", url:"https://arpitprk89.github.io/Who-is-Arpit-/" },
  { icon:"✦", title:"Arpit's Zone", desc:"Design, develop, inspire — bringing tech education to small-town students.", url:"https://arpitprk89.github.io/Arpit-s-zone-/" },
  { icon:"🗂️", title:"Full Portfolio", desc:"Every project, certificate, and link, in one place.", url:"https://arpitprk89.github.io/arpit-portfolio/" },
];

const grid = document.getElementById('grid');
grid.innerHTML = projects.map((p,i) => `
  <a class="card" href="${p.url}" target="_blank" rel="noopener" data-i="${i}">
    <div class="cardIcon c${i%5}">${p.icon}</div>
    <div class="cardTitle">${p.title}</div>
    <div class="cardDesc">${p.desc}</div>
    <div class="cardLink">Enter <span class="arrow">→</span></div>
  </a>
`).join('');

/* ---------- Robot Lion: voice + bubble ---------- */
const lionRig = document.getElementById('lionRig');
const lionBubble = document.getElementById('lionBubble');

let femaleVoice = null;
function pickFemaleVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length) return;
  const prefNames = ['female','samantha','zira','susan','victoria','karen','moira','tessa','fiona','google uk english female','google us english'];
  femaleVoice = voices.find(v => prefNames.some(n => v.name.toLowerCase().includes(n)))
             || voices.find(v => v.name.toLowerCase().includes('female'))
             || voices.find(v => v.lang && v.lang.startsWith('en'))
             || voices[0];
}
if('speechSynthesis' in window){
  pickFemaleVoice();
  window.speechSynthesis.onvoiceschanged = pickFemaleVoice;
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(femaleVoice) u.voice = femaleVoice;
    u.rate = 1; u.pitch = 1.3; u.volume = 1;
    window.speechSynthesis.speak(u);
  }catch(e){ /* speech not available, bubble text still shows */ }
}

/* ---------- Sweet ambient background music (Web Audio, generated) ---------- */
let audioCtx = null, musicOn = false, musicTimer = null, masterGain = null;
const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33]; // C major pentatonic-ish, gentle

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0;
  const delay = audioCtx.createDelay();
  delay.delayTime.value = 0.38;
  const feedback = audioCtx.createGain();
  feedback.gain.value = 0.28;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2200;
  masterGain.connect(lp);
  lp.connect(audioCtx.destination);
  lp.connect(delay);
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(audioCtx.destination);
}

function pluckNote(freq, time, dur, vol){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.connect(g);
  g.connect(masterGain);
  osc.start(time);
  osc.stop(time + dur + 0.05);
}

function scheduleLoop(){
  if(!musicOn) return;
  const now = audioCtx.currentTime;
  let t = now;
  for(let i=0;i<8;i++){
    const note = scale[Math.floor(Math.random()*scale.length)];
    const dur = 1.1 + Math.random()*0.6;
    pluckNote(note, t, dur, 0.05 + Math.random()*0.03);
    if(Math.random() > 0.5) pluckNote(note*2, t+0.15, dur*0.7, 0.02);
    t += 0.75 + Math.random()*0.4;
  }
  musicTimer = setTimeout(scheduleLoop, (t-now)*1000 - 300);
}

function startMusic(){
  initAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  musicOn = true;
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 1.2);
  scheduleLoop();
  musicBtn.classList.add('on');
  musicBtn.textContent = '🔊';
}
function stopMusic(){
  musicOn = false;
  clearTimeout(musicTimer);
  if(masterGain) masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
  musicBtn.classList.remove('on');
  musicBtn.textContent = '🔈';
}

const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', ()=>{ musicOn ? stopMusic() : startMusic(); });

function say(text, duration){
  lionBubble.textContent = text;
  lionBubble.classList.add('show');
  speak(text);
  clearTimeout(say._t);
  say._t = setTimeout(()=> lionBubble.classList.remove('show'), duration || 2600);
}

function greetAndDock(){
  lionRig.classList.add('flyIn');
  setTimeout(()=>{
    say("Hello! Welcome to Arpit's Project World.", 3200);
  }, 650);
  setTimeout(()=>{
    lionRig.classList.add('dock');
    setTimeout(()=> lionRig.classList.add('pulseDock'), 1000);
  }, 3600);
}

grid.addEventListener('click', function(e){
  const card = e.target.closest('.card');
  if(!card) return;
  e.preventDefault();
  const i = parseInt(card.dataset.i);
  const p = projects[i];

  const win = window.open('', '_blank');

  lionRig.classList.remove('pulseDock');
  lionRig.classList.remove('dock');
  lionRig.classList.add('flyIn');
  say(`Welcome to ${p.title} project!`, 1700);

  setTimeout(()=>{
    if(win) win.location = p.url;
    lionRig.classList.add('dock');
    setTimeout(()=> lionRig.classList.add('pulseDock'), 1000);
  }, 1700);
});

/* ---------- Opening animation ---------- */
const openStage = document.getElementById('openStage');
const boxWrap = document.getElementById('boxWrap');
const burstLayer = document.getElementById('burst');
const main = document.getElementById('main');

function spawnBurst(cx, cy){
  const colors = ['#4fe3ff','#b388ff','#ff6fd8','#f0c674','#ffffff'];
  for(let i=0;i<60;i++){
    const el = document.createElement('div');
    el.className = 'spark';
    const angle = Math.random()*Math.PI*2;
    const dist = 120 + Math.random()*280;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 60;
    const size = 3 + Math.random()*5;
    el.style.left = cx+'px';
    el.style.top = cy+'px';
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.boxShadow = `0 0 ${size*3}px currentColor`;
    el.style.transition = `transform ${0.9+Math.random()*0.6}s cubic-bezier(.2,.8,.3,1), opacity ${1+Math.random()*0.4}s ease`;
    burstLayer.appendChild(el);
    requestAnimationFrame(()=>{
      el.style.opacity = '1';
      requestAnimationFrame(()=>{
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        el.style.opacity = '0';
      });
    });
    setTimeout(()=>el.remove(), 1800);
  }
}

let opened = false;
function openBox(){
  if(opened) return;
  opened = true;
  const rect = boxWrap.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2 - 10;

  openStage.classList.add('opened');
  spawnBurst(cx, cy);
  startMusic();

  setTimeout(()=>{
    openStage.classList.add('hidden');
    main.classList.add('show');
    document.body.style.overflow = 'auto';
    greetAndDock();
  }, 900);
}

boxWrap.addEventListener('click', openBox);
boxWrap.addEventListener('touchend', (e)=>{ e.preventDefault(); openBox(); });

/* lock scroll until opened */
document.body.style.overflow = 'hidden';
</script>
</body>
